name: Trunk Code Quality

on:
  workflow_call:
    inputs:
      persist-credentials:
        description: Persist credentials for the checkout step. Set to true if required by subsequent steps or setup-ci.
        type: boolean
        required: false
        default: false
      owner:
        description: Owner (user or organisation) the GitHub App token is scoped to. Defaults to the owner of the calling repository.
        type: string
        required: false
        default: ""
      additional-repos:
        description: Newline-delimited list of additional repository names to scope the token to, alongside the calling repository. Needed for zizmor online-mode reusable workflow checks.
        type: string
        required: false
        default: workflows
    secrets:
      github-app-id:
        description: GitHub App client ID.
        required: true
      github-app-private-key:
        description: GitHub App private key.
        required: true

# Disable permissions for all available scopes
permissions: {}

jobs:
  trunk-code-quality:
    name: Code Quality Check
    permissions:
      contents: read # Required to checkout the repository
    # slim runner does not perform well with setup CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level with a unique prefix so it can't match a caller's workflow-level group
    concurrency:
      group: trunk-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      # trunk-ignore(zizmor/zizmor/artipacked): Defaults to false, but can be overridden by the workflow input
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: ${{ inputs.persist-credentials }}

      # Use GitHub App token for trunk; allows zizmor to run in
      # 'online-mode' which allows reusable workflow checks
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.github-app-id }}
          private-key: ${{ secrets.github-app-private-key }}
          owner: ${{ inputs.owner || github.repository_owner }}
          permission-actions: write # Enable GitHub Action caching for Trunk
          permission-contents: read
          permission-checks: write # Required for Trunk to post annotations
          # Scope repositories for the GitHub App token; additional repos are
          # required for reusable workflow checks by Zizmor in online mode
          repositories: |
            ${{ github.repository }}
            ${{ inputs.additional-repos }}

      - name: Run Code Quality
        uses: trunk-io/trunk-action@v2.0.0
        with:
          # Run 'trunk check --all' on linter upgrades to verify updates do not
          # produce errors
          arguments: ${{ github.head_ref == 'trunk-io/update-trunk' && '--all' || '' }}
          github-token: ${{ steps.app-token.outputs.token }}
